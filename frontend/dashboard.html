<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Feedback Analyser - Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>

    <!-- HEADER -->
    <header class="header-container glass-panel">
        <div class="header-title">
            <h1>AI Feedback Analyser Dashboard</h1>
            <p>Insights from customer feedback</p>
        </div>
        <div class="header-actions">
            <a href="index.html" class="btn-nav">Back to Form</a>
            <button id="theme-toggle" class="theme-toggle" aria-label="Toggle dark mode">🌙</button>
        </div>
    </header>

    <main class="container">
        <!-- SUMMARY STATS -->
        <h2 class="section-title">Summary Stats</h2>
        <div class="stats-grid">
            <div class="stat-card glass-panel">
                <span class="stat-num total" id="total-count">0</span>
                <span class="stat-lbl">Total Feedback</span>
            </div>
            <div class="stat-card glass-panel">
                <span class="stat-num pos" id="positive-count">0</span>
                <span class="stat-lbl">Positive</span>
            </div>
            <div class="stat-card glass-panel">
                <span class="stat-num neg" id="negative-count">0</span>
                <span class="stat-lbl">Negative</span>
            </div>
        </div>

        <!-- CHARTS -->
        <h2 class="section-title">Charts</h2>
        <div class="charts-grid">
            <div class="chart-card glass-panel">
                <p class="chart-title">Sentiment Distribution</p>
                <div class="chart-wrapper">
                    <canvas id="pieChart"></canvas>
                </div>
            </div>
            <div class="chart-card glass-panel">
                <p class="chart-title">Feedback by Category</p>
                <div class="chart-wrapper">
                    <canvas id="barChart"></canvas>
                </div>
            </div>
        </div>

        <!-- FEEDBACK TABLE -->
        <h2 class="section-title">All Feedback Entries</h2>
        <div class="table-card glass-panel">
            <table id="feedback-table">
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Feedback</th>
                        <th>Category</th>
                        <th>Sentiment</th>
                        <th>Time</th>
                    </tr>
                </thead>
                <tbody id="table-body">
                </tbody>
            </table>
        </div>
    </main>

    <script src="theme.js"></script>
    <script src="dashboard.js"></script>

</body>
</html>
